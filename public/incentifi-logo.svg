<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">IncentiFi Logo</title>
  <desc id="desc">A dark square mark with a green-blue circle and upward arrow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101819"/>
      <stop offset="1" stop-color="#05080A"/>
    </linearGradient>
    <linearGradient id="orb" x1="130" y1="110" x2="365" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FCE73"/>
      <stop offset="0.48" stop-color="#2B846D"/>
      <stop offset="1" stop-color="#143958"/>
    </linearGradient>
    <linearGradient id="arrow" x1="120" y1="330" x2="390" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#183A55"/>
      <stop offset="0.42" stop-color="#8FC5C6"/>
      <stop offset="1" stop-color="#A8E18A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <circle cx="258" cy="253" r="128" fill="url(#orb)"/>
    <path d="M152 328 242 239l64 49 116-125-19 82 61-18-129 139-65-50-88 86z" fill="#071012" opacity="0.72"/>
    <path d="M138 315 235 220l65 49 116-125-18 81 61-17-130 139-64-50-94 92z" fill="url(#arrow)"/>
    <path d="M138 315 235 220l65 49 116-125-5 24-110 119-65-48-85 83z" fill="#D6F4E6" opacity="0.24"/>
    <path d="M166 163 194 197" stroke="#8FCE73" stroke-width="15" stroke-linecap="round"/>
    <path d="M208 138 223 176" stroke="#8FCE73" stroke-width="15" stroke-linecap="round"/>
    <path d="M133 201 170 222" stroke="#5CAE72" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
